<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>École Internationale Robert Schuman</title>
  <!-- Redirect based on browser language before any rendering -->
  <script type="module" src="./scripts/core/redirect.js" defer></script>
  <style>
    /* Hide body until redirect script runs */
    body { display: none; }
  </style>
  <noscript><style>body { display: block; }</style></noscript>
</head>
<body>
  <noscript>
    <p style="text-align:center; padding:20px;">
      <a href="/fr/index.html">Aller à la version française</a> |
      <a href="/en/index.html">Go to the English version</a>
    </p>
  </noscript>
  <script>
    // The redirect module runs after parsing; if it has not navigated away
    // within a few seconds, show a manual fallback link.
    setTimeout(function () {
      document.body.style.cssText = 'display:flex;justify-content:center;align-items:center;height:100vh';
      document.body.innerHTML = '<p>Redirect failed. <a href="/en/index.html">Click here to continue</a></p>';
    }, 3000);
  </script>
</body>
</html>
